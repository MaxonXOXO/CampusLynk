  <div id="scheduleExamModal"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">

      <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-black text-slate-800 tracking-tight">Schedule New Online Test</h3>
        <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-600 font-black text-lg">✕</button>
      </div>

      <form onsubmit="submitNewExam(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Subject</label>
            <select id="examSubjectSelect" required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Classroom Group</label>
            <select id="examClassSelect" required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500"></select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Test Title / Name</label>
          <input type="text" id="examNameInput" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500"
            placeholder="e.g. Unit Test 1">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Start Date &
              Time</label>
            <input type="datetime-local" id="examStartInput" required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">End Date & Time</label>
            <input type="datetime-local" id="examEndInput" required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Duration (Mins)</label>
            <input type="number" id="examDurationInput" required min="10" max="180"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none"
              value="30">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">MCQ Count</label>
            <input type="number" id="examMcqCount" required min="0"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none"
              value="4">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Descriptive
              Count</label>
            <input type="number" id="examDescCount" required min="0"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none"
              value="1">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target %
              (Attainment)</label>
            <input type="number" id="examTargetPct" required min="1" max="100"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none"
              value="50">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Pass Threshold %
              (Score)</label>
            <input type="number" id="examPassThreshold" required min="1" max="100"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none"
              value="40">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Map Course Outcomes
            (COs)</label>
          <div class="flex gap-4 font-bold text-xs">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="co1Check" checked class="w-4 h-4 rounded text-blue-600"> CO1
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="co2Check" checked class="w-4 h-4 rounded text-blue-600"> CO2
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="co3Check" class="w-4 h-4 rounded text-blue-600"> CO3
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="co4Check" class="w-4 h-4 rounded text-blue-600"> CO4
            </label>
            <script>
              const facultyMobile = sessionStorage.getItem("userId");
              let facultyName = sessionStorage.getItem("userName");
              if (!facultyName || facultyName === "null" || facultyName.trim() === "") {
                facultyName = "Faculty Member";
              }
              const facultyBranch = sessionStorage.getItem("userBranch");
              const facultyPhoto = sessionStorage.getItem("userPhoto");
              const facultyRole = sessionStorage.getItem("userRole") || "Lecturer";

              let activeView = "subjects";
              
              // Dynamic role routing on startup
              if (["NSS_Coordinator", "NCC_Officer", "IEDC_Coordinator", "Physical_Education_Director"].includes(facultyRole)) {
                activeView = "extraPoints";
              } else if (facultyRole === "Placement_Officer") {
                activeView = "placementDesk";
              }

              let myMappings = [];
              let myExams = [];
              let pendingAIReviews = [];

              let qbankSubTab = "manual";

              let activeMarksRoster = [];
              let activeClassLogRoster = [];
              let activeLessonPlans = [];
              let activeCOPOMappings = [];

              let selfProfileBase64Photo = "";

              if (!facultyMobile) {
                navigateToPage("Login");
              }

              document.getElementById("facultyNameText").innerText = facultyName;
              document.getElementById("facultyBranchText").innerText = getBranchFullName(facultyBranch) + " Department";
              if (facultyPhoto) {
                document.getElementById("facultyProfilePic").src = facultyPhoto;
              }

              window.addEventListener("load", function () {
                // Toggle sidebar buttons visibility
                if (["NSS_Coordinator", "NCC_Officer", "IEDC_Coordinator", "Physical_Education_Director"].includes(facultyRole)) {
                  const el = document.getElementById("nav-extraPoints");
                  if (el) el.classList.remove("hidden");
                }
                if (facultyRole === "Placement_Officer") {
                  const el = document.getElementById("nav-placementDesk");
                  if (el) el.classList.remove("hidden");
                }

                fetchFacultyClassMappings();
                loadAIPendingReviews();

                // Check supervision status to show Tutor Panel link
                google.script.run
                  .withSuccessHandler(function(response) {
                    if (response.status === "SUCCESS" && response.isSupervisor) {
                      const link = document.getElementById("nav-tutorPanel");
                      if (link) link.classList.remove("hidden");
                    }
                  })
                  .checkStaffSupervisionStatus(facultyMobile);
              });

              function fetchFacultyClassMappings() {
                google.script.run
                  .withSuccessHandler(function (response) {
                    if (response.status === "SUCCESS") {
                      myMappings = response.mappings;
                      fetchFacultyExams();
                    } else {
                      alert("Error fetching maps: " + response.message);
                    }
                  })
                  .withFailureHandler(function (err) {
                    alert("Error: " + err.message);
                  })
                  .getFacultyAssignedClasses(facultyMobile);
              }

              function fetchFacultyExams() {
                google.script.run
                  .withSuccessHandler(function (response) {
                    if (response.status === "SUCCESS") {
                      myExams = response.exams;
                      renderView();
                    }
                  })
                  .getFacultyExams(facultyMobile);
              }

              function loadAIPendingReviews() {
                google.script.run
                  .withSuccessHandler(function (response) {
                    if (response.status === "SUCCESS") {
                      pendingAIReviews = response.evaluations;
                      const badge = document.getElementById("aiPendingBadge");
                      if (pendingAIReviews.length > 0) {
                        badge.innerText = pendingAIReviews.length;
                        badge.classList.remove("hidden");
                      } else {
                        badge.classList.add("hidden");
                      }
                    }
                  })
                  .getPendingDescEvaluations(facultyMobile);
              }

              function switchView(viewName) {
                activeView = viewName;

                const navIds = ['subjects', 'qbank', 'aiEval', 'academicMarks', 'classLog', 'lessonPlan', 'copoMap', 'attainment', 'studentReport', 'courseFile', 'profile'];
                navIds.forEach(id => {
                  const btn = document.getElementById(`nav-${id}`);
                  if (btn) {
                    if (id === viewName) {
                      btn.className = "w-full text-left px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-3 bg-blue-600/15 text-blue-400 transition-premium";
                    } else {
                      btn.className = "w-full text-left px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-premium";
                    }
                  }
                });

                renderView();
              }

              function handleSemesterChange() {
                renderView();
              }

              function switchQBankTab(tabName) {
                qbankSubTab = tabName;
                ['manual', 'ai', 'pdf', 'csv', 'text', 'modelConfig'].forEach(tab => {
                  const el = document.getElementById(`qtab-${tab}`);
                  if (el) {
                    if (tab === tabName) {
                      el.className = "px-4 py-2 rounded-xl text-xs font-black transition-premium bg-blue-600 text-white shadow-md shadow-blue-500/10";
                    } else {
                      el.className = "px-4 py-2 rounded-xl text-xs font-black transition-premium text-slate-500 bg-slate-100 hover:bg-slate-200";
                    }
                  }
                });
                renderQBankFormPanel();
              }

              function renderView() {
                const container = document.getElementById("viewContainer");
                const title = document.getElementById("viewTitle");
                const subtext = document.getElementById("viewSubtext");
                const actions = document.getElementById("viewActions");
                const selectedSem = document.getElementById("semesterSwitcher").value;

                actions.innerHTML = "";

                if (activeView === "subjects") {
                  title.innerText = "My Subject Rooms";
                  subtext.innerText = "Setup exam papers, timers, and manage online tests.";

                  actions.innerHTML = `
          <button onclick="openScheduleModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-blue-500/10 flex items-center justify-center gap-1">
            <span class="material-symbols-rounded text-sm">add</span> Schedule Online Test
          </button>
        `;

                  const filteredMaps = myMappings.filter(m => m.Classroom_ID.includes(selectedSem));

                  if (filteredMaps.length === 0) {
                    container.innerHTML = `
            <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center">
              <span class="text-5xl block mb-3">📭</span>
              <h3 class="font-black text-slate-800 text-lg">No Subjects Mapped</h3>
              <p class="text-slate-400 text-sm mt-1 max-w-sm mx-auto font-medium">You have not been assigned to teach any subjects for ${selectedSem}. Contact HOD to map subjects.</p>
            </div>
          `;
                    return;
                  }

                  container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${filteredMaps.map(m => {
                    const classExams = myExams.filter(e => e.Classroom_ID === m.Classroom_ID && e.Subject_Code === m.Subject_Code);
                    return `
                <div class="bg-white border border-slate-200 rounded-3xl p-6 hover-scale shadow-sm flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start">
                      <span class="text-[10px] bg-blue-100 text-blue-800 font-extrabold uppercase px-2.5 py-0.5 rounded-full">${m.Subject_Code}</span>
                      <span class="text-[10px] bg-slate-100 text-slate-600 font-extrabold px-2.5 py-0.5 rounded-full">${m.Classroom_ID}</span>
                    </div>
                    <h3 class="font-extrabold text-slate-800 text-base mt-3 leading-tight">${m.Subject_Name}</h3>
                    <p class="text-slate-400 text-xs mt-1 font-semibold">Active Exams Scheduled: ${classExams.length}</p>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Type: <span class="text-blue-600">${m.Course_Type || "Theory"}</span> | Attainment Threshold: ${m.Attainment_Threshold || "50"}%</p>
                  </div>
                  
                  <div class="mt-6 border-t pt-4 space-y-2.5">
                    ${classExams.map(ex => `
                      <div class="flex justify-between items-center text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200/60 rounded-xl p-3">
                        <div>
                          <span>${ex.Test_Name}</span>
                          <span class="block text-[10px] text-slate-400 font-semibold mt-0.5">Duration: ${ex.Duration} mins</span>
                        </div>
                        <span class="${ex.Is_Active ? 'text-green-600 bg-green-50 px-2 py-0.5 rounded-md border border-green-200' : 'text-slate-400'}">${ex.Is_Active ? 'Active' : 'Closed'}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `;
                  }).join("")}
          </div>
        `;
                }
                else if (activeView === "qbank") {
                  title.innerText = "Question Bank Catalog & Importers";
                  subtext.innerText = "Add questions using standard forms, CSV uploads, Gemini AI keyword generation, or syllabus PDFs.";

                  const filteredMaps = myMappings.filter(m => m.Classroom_ID.includes(selectedSem));
                  if (filteredMaps.length === 0) {
                    container.innerHTML = `<p class="text-slate-400 text-sm font-semibold">No assigned subjects to manage questions.</p>`;
                    return;
                  }

                  const defaultSubject = filteredMaps[0].Subject_Code;

                  container.innerHTML = `

                  let text = "";

                  for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();

                  statusEl.innerHTML = `Successfully parsed! <b class="text-green-600">${text.length} characters</b> extracted.`;

              function handleCSVQuestionUpload(event) {
                event.preventDefault();
                const fileEl = document.getElementById("csvFileSelector");
                const file = fileEl.files[0];
                if (!file) {
                  alert("Please select a CSV file first.");
                  return;
                }
                const reader = new FileReader();
                reader.onload = function (e) {
                  const text = e.target.result;
                  try {
                    const lines = text.split("\n");
                    if (lines.length <= 1) return;
                    const headers = lines[0].split(",").map(h => h.trim().replace(/^["']|["']$/g, ""));
                    const questionsArray = [];
                    for (let i = 1; i < lines.length; i++) {
                      if (!lines[i].trim()) continue;
                      const row = lines[i].split(",").map(cell => cell.trim().replace(/^["']|["']$/g, ""));
                      const qObj = {};
                      headers.forEach((h, colIdx) => qObj[h] = row[colIdx] || "");
                      if (qObj.Subject_Code && qObj.Type && qObj.CO_Tag && qObj.Question_Text) {
                        let options = [];
                        if (qObj.Type === "MCQ") {
                          options = [qObj.Option_A, qObj.Option_B, qObj.Option_C, qObj.Option_D].filter(Boolean);
                        }
                        questionsArray.push({ Subject_Code: qObj.Subject_Code, Type: qObj.Type, CO_Tag: qObj.CO_Tag, Question_Text: qObj.Question_Text, Options: options, Correct_Answer: qObj.Correct_Answer });
                      }
                    }
                    google.script.run
                      .withSuccessHandler(res => { alert(res.message); switchView("qbank"); })
                      .importQuestions(questionsArray);
                  } catch (err) { alert(err.message); }
                };
                reader.readAsText(file);
              }

              function handleSelfProfileUpdate(e) {
                e.preventDefault();
                google.script.run
                  .withSuccessHandler(() => { alert("Updated!"); window.location.reload(); })
                  .updateStaffProfileSelf(facultyMobile, { name: document.getElementById("selfName").value, email: document.getElementById("selfEmail").value });
              }

              function handleLogout() {
                sessionStorage.clear();
                navigateToPage("Login");
              }
            </script>
</body>
