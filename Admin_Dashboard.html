  <script>
    const adminMobile = sessionStorage.getItem("userId");
    let adminName = sessionStorage.getItem("userName");
    if (!adminName || adminName === "null" || adminName.trim() === "") {
      adminName = "Administrator";
    }
    const adminPhoto = sessionStorage.getItem("userPhoto");
    
    let activeAdminView = "staffApp";
    let pendingStaff = [];
    let allApprovedStaff = [];
    let auditLogs = [];
    let masterStudentsList = [];
    
    let crudMode = "create";
    let mStudentBase64Photo = "";
    let selfProfileBase64Photo = "";

    // Guard login
    if (!adminMobile) {
      navigateToPage("Login");
    }

    // Init profile
    document.getElementById("adminNameText").innerText = adminName;
    if (adminPhoto) {
      document.getElementById("adminProfilePic").src = adminPhoto;
    }

    window.addEventListener("load", function() {
      fetchAdminData();
    });

    function fetchAdminData() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            pendingStaff = response.staff;
            allApprovedStaff = response.allApprovedStaff;
            
            // Set badge
            const badge = document.getElementById("adminPendingBadge");
            if (pendingStaff.length > 0) {
              badge.innerText = pendingStaff.length;
              badge.classList.remove("hidden");
            } else {
              badge.classList.add("hidden");
            }
            
            fetchAuditTrail();
          }
        })
        .getPendingAccounts();
    }

    function fetchAuditTrail() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            auditLogs = response.logs;
            fetchStudentsMaster();
          }
        })
        .getSystemLogs();
    }

    function fetchStudentsMaster() {
      // Pull student list by loading ECE (or mock student sheets)
      // Since admin needs universal student management, let's load all branch students
      // We can get student roster by fetching from mock sheets
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            // Simulator allows fetching roster with a blank branch or let's run general lookup
            // Wait, getHODStudentRoster fetches by branch. Let's make an RPC request or load from sheets
            // Since HOD student roster fetches branch-specific, let's request students list directly
            // In Code.gs, let's look: getPendingAccounts actually loads all students. Let's fetch it:
            masterStudentsList = response.students || [];
            // If getPendingAccounts only returned pending students, let's fetch students roster using general service
            // Wait, we can fetch HOD roster for each branch, or let's query all students.
            // Let's call a mock loader that fetches all students. We can request ECE students and EEE students.
            // For simulator simplicity, let's query approved roster of a major branch or mock ECE branch:
            google.script.run
              .withSuccessHandler(function(res) {
                if (res.status === "SUCCESS") {
                  masterStudentsList = res.roster;
                  renderAdminView();
                }
              })
              .getHODStudentRoster("ECE");
          }
        })
        .getPendingAccounts();
    }

    function switchAdminView(viewName) {
      activeAdminView = viewName;
      
      const navIds = ['staffApp', 'students', 'passReset', 'audit', 'obeSetup', 'profile'];
      navIds.forEach(id => {
        const btn = document.getElementById(`adminNav-${id}`);
        if (id === viewName) {
          btn.className = "w-full text-left px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-3 bg-blue-600/15 text-blue-400 transition-premium";
        } else {
          btn.className = "w-full text-left px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-premium";
        }
      });
      
      renderAdminView();
    }

    function renderAdminView() {
      const container = document.getElementById("adminViewContainer");
      const title = document.getElementById("adminViewTitle");
      const subtext = document.getElementById("adminViewSubtext");
      const actions = document.getElementById("adminViewActions");
      
      actions.innerHTML = "";
      
      if (activeAdminView === "staffApp") {
        title.innerText = "Staff Approvals Gate";
        subtext.innerText = "Verify credentials and approve registration profiles for department staff.";
        
        if (pendingStaff.length === 0) {
          container.innerHTML = `
            <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center max-w-md mx-auto">
              <span class="material-symbols-rounded text-5xl text-emerald-500 block mb-3">check_circle</span>
              <h3 class="font-black text-slate-800 text-lg">No Pending Registrations</h3>
              <p class="text-slate-400 text-sm mt-1 font-semibold">All staff registrations are approved.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Pending Staff Approvals</h3>
            <div class="space-y-4">
              ${pendingStaff.map(staff => `
                <div class="flex flex-col md:flex-row items-center justify-between p-4 border rounded-2xl bg-slate-50 gap-4">
                  <div class="flex items-center gap-3">
                    <img src="${staff.Photo_Drive_Link}" class="w-12 h-12 rounded-full border object-cover">
                    <div>
                      <span class="font-bold text-sm block text-slate-800">${staff.Name}</span>
                      <span class="text-xs text-slate-400 font-semibold">Mobile ID: ${staff.Mobile_No} | Email: ${staff.Email}</span>
                      <span class="text-xs text-blue-600 font-bold block uppercase mt-0.5">Role: ${staff.Designation} | Branch: ${staff.Branch}</span>
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <button onclick="approveStaffUser('${staff.Mobile_No}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-emerald-500/10">Approve Access</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      } 
      else if (activeAdminView === "students") {
        title.innerText = "Student Master CRUD Console";
        subtext.innerText = "Full institution-wide control to create, modify, and delete student records.";
        
        actions.innerHTML = `
          <button onclick="openAddStudentModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium">
            ➕ Add Student Record
          </button>
        `;
        
        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Registered Students Catalog</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-bold">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider">
                    <th class="p-3 w-16">Photo</th>
                    <th class="p-3">Register No</th>
                    <th class="p-3">Admission No</th>
                    <th class="p-3">Student Name</th>
                    <th class="p-3">Branch</th>
                    <th class="p-3">Classroom Group</th>
                    <th class="p-3 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody class="text-slate-600">
                  ${masterStudentsList.map(s => `
                    <tr class="border-b hover:bg-slate-50">
                      <td class="p-3">
                        <img src="${s.Photo_Drive_Link}" class="w-10 h-10 rounded-full object-cover border">
                      </td>
                      <td class="p-3 font-mono">${s.Reg_No}</td>
                      <td class="p-3 font-mono">${s.Adm_No}</td>
                      <td class="p-3 text-slate-800">${s.Name}</td>
                      <td class="p-3 uppercase text-blue-600">${s.Branch}</td>
                      <td class="p-3 text-slate-400">${s.Classroom_ID}</td>
                      <td class="p-2 text-center space-x-2">
                        <button onclick="openEditStudentModal('${s.Reg_No}')" class="px-2.5 py-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-premium">Edit</button>
                        <button onclick="deleteStudent('${s.Reg_No}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-premium">Delete</button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
      else if (activeAdminView === "passReset") {
        title.innerText = "Password Manager Console";
        subtext.innerText = "Force reset password for any student or staff profile in the college database.";
        
        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm max-w-md mx-auto">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight">Force Reset User Credentials</h3>
            
            <form onsubmit="handleForceReset(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Account ID</label>
                <input type="text" id="resetTargetId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="e.g. REG24EC01 or Mobile No">
              </div>
              
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Account Type</label>
                <select id="resetTargetType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                  <option value="student">Student</option>
                  <option value="staff">Staff Member</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">New Temporary Password</label>
                <input type="text" id="resetNewPassword" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="e.g. Welcome@123" value="Welcome@123">
              </div>

              <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow-lg transition-premium text-xs">
                Override & Save Credentials
              </button>
            </form>
          </div>
        `;
      } 
      else if (activeAdminView === "audit") {
        title.innerText = "Security Audit Trail Logs";
        subtext.innerText = "Real-time log tracking student tab switching warnings, active logins, and exam submissions.";
        
        if (auditLogs.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-xs font-bold py-6 text-center bg-white border rounded-3xl">No logs recorded in the system yet.</p>`;
          return;
        }

        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-bold">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider">
                    <th class="p-3">Log ID</th>
                    <th class="p-3">User ID</th>
                    <th class="p-3">Test ID</th>
                    <th class="p-3">Action</th>
                    <th class="p-3">Details</th>
                    <th class="p-3">Timestamp</th>
                  </tr>
                </thead>
                <tbody class="text-slate-600">
                  ${auditLogs.map(log => {
                    let actionBadge = "bg-slate-100 text-slate-700";
                    if (log.Action === "Tab_Switch_Warning") actionBadge = "bg-red-100 text-red-700";
                    else if (log.Action === "Manual_Submit") actionBadge = "bg-green-100 text-green-700";
                    else if (log.Action === "Login") actionBadge = "bg-blue-100 text-blue-700";

                    return `
                      <tr class="border-b hover:bg-slate-50">
                        <td class="p-3 font-mono text-slate-400">${log.Log_ID}</td>
                        <td class="p-3 font-mono">${log.Reg_No}</td>
                        <td class="p-3 font-mono text-slate-400">${log.Test_ID}</td>
                        <td class="p-3">
                          <span class="px-2 py-0.5 rounded-md ${actionBadge} text-[9px] uppercase font-black">${log.Action}</span>
                        </td>
                        <td class="p-3 font-medium text-slate-800">${log.Details}</td>
                        <td class="p-3 text-slate-400 font-mono">${new Date(log.Timestamp).toLocaleString()}</td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
      else if (activeAdminView === "obeSetup") {
        title.innerText = "OBE Institution & PO Configurator";
        subtext.innerText = "Manage institutional Vision/Mission statement and NBA Program Outcomes PO1-PO12 definitions.";
        
        container.innerHTML = `
          <div class="space-y-6 max-w-4xl mx-auto">
            <!-- Vision Mission Section -->
            <div class="bg-white border rounded-3xl p-6 shadow-sm">
              <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Institution Vision & Mission</h3>
              <form onsubmit="handleSaveInstConfig(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Institution Name</label>
                  <input type="text" id="instNameInput" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Institution Vision Statement</label>
                    <textarea id="instVisionInput" required rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-800 focus:outline-none"></textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Institution Mission Statement</label>
                    <textarea id="instMissionInput" required rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-bold text-slate-800 focus:outline-none"></textarea>
                  </div>
                </div>
                <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium">Save Institutional Vision/Mission</button>
              </form>
            </div>

            <!-- Program Outcomes Section -->
            <div class="bg-white border rounded-3xl p-6 shadow-sm">
              <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">NBA Diploma Engineering PO Descriptions</h3>
              <form onsubmit="handleSavePOConfigs(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="poFieldsContainer">
                  <!-- Generated dynamically -->
                </div>
                <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium">Save PO Definitions</button>
              </form>
            </div>

            <!-- Maintenance & Utility Section -->
            <div class="bg-white border border-red-200 rounded-3xl p-6 shadow-sm">
              <h3 class="text-base font-black text-red-800 mb-2 tracking-tight">Database Refresh & System Diagnostics</h3>
              <p class="text-xs font-bold text-slate-500 mb-4">Clears structural caches and verifies all database tabs, pre-populating defaults if sheets are missing. This does not erase student marks.</p>
              <button onclick="triggerDBReinit()" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-red-500/10">Force DB Re-initialization & PO Sync</button>
            </div>
          </div>
        `;

        // Fetch current values
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              const c = response.config;
              document.getElementById("instNameInput").value = c.Institution_Name || "";
              document.getElementById("instVisionInput").value = c.Institution_Vision || "";
              document.getElementById("instMissionInput").value = c.Institution_Mission || "";
            }
          })
          .getInstitutionConfig();

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              const poContainer = document.getElementById("poFieldsContainer");
              poContainer.innerHTML = response.pos.map(po => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl">
                  <label class="block text-xs font-black text-blue-800 uppercase mb-1">${po.PO_ID}: ${po.PO_Name}</label>
                  <textarea id="poDesc-${po.PO_ID}" required rows="2" class="w-full bg-white border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 focus:outline-none">${po.Description}</textarea>
                </div>
              `).join("");
            }
          })
          .getPOConfigs();
      }
      else if (activeAdminView === "profile") {
        title.innerText = "My Profile Settings";
        subtext.innerText = "Update your credentials, administrator email, or password.";
        
        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm max-w-lg mx-auto">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Edit Staff Profile</h3>
            
            <form onsubmit="handleSelfProfileUpdate(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" id="selfName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" value="${adminName}">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="selfEmail" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">New Password (leave empty to keep current)</label>
                <input type="password" id="selfPassword" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="••••••••">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Replace Avatar Photo</label>
                <input type="file" id="selfPhoto" accept="image/*" onchange="convertSelfPhotoToBase64()" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
                <div class="mt-2 flex justify-center">
                  <img id="selfPhotoPreview" src="${adminPhoto || 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=100'}" class="w-20 h-20 rounded-full object-cover border">
                </div>
              </div>

              <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition-premium text-xs">
                Save Changes
              </button>
            </form>
          </div>
        `;
        
        const selfData = allApprovedStaff.find(s => s.Mobile_No === adminMobile);
        if (selfData) {
          document.getElementById("selfEmail").value = selfData.Email;
        }
      }
    }

    function approveStaffUser(mobileNo) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Staff account approved successfully.");
            fetchAdminData();
          }
        })
        .approveAccount(mobileNo, 'staff');
    }

    function handleSaveInstConfig(e) {
      e.preventDefault();
      const name = document.getElementById("instNameInput").value.trim();
      const vision = document.getElementById("instVisionInput").value.trim();
      const mission = document.getElementById("instMissionInput").value.trim();
      
      google.script.run
        .withSuccessHandler(function(response) {
          alert(response.message);
        })
        .saveInstitutionConfig({
          Institution_Name: name,
          Institution_Vision: vision,
          Institution_Mission: mission
        });
    }

    function handleSavePOConfigs(e) {
      e.preventDefault();
      const configs = [];
      for (let i = 1; i <= 12; i++) {
        const descVal = document.getElementById(`poDesc-PO${i}`).value.trim();
        configs.push({
          PO_ID: `PO${i}`,
          Description: descVal
        });
      }

      google.script.run
        .withSuccessHandler(function(response) {
          alert(response.message);
        })
        .savePOConfigs(configs);
    }

    function triggerDBReinit() {
      if (confirm("Wipe cache and force re-initialize database layout?")) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert(response.message);
              window.location.reload();
            } else {
              alert("Error: " + response.message);
            }
          })
          .forceReinitializeDatabase();
      }
    }

    function handleForceReset(e) {
      e.preventDefault();
      
      const targetId = document.getElementById("resetTargetId").value.trim();
      const userType = document.getElementById("resetTargetType").value;
      const newPassword = document.getElementById("resetNewPassword").value.trim();

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Password updated successfully to: " + newPassword);
            document.getElementById("resetTargetId").value = "";
          } else {
            alert("Error: " + response.message);
          }
        })
        .adminResetPassword(targetId, userType, newPassword);
    }

    // ============================================================================
    // STUDENT CRUD ACTIONS (ADMIN LEVEL)
    // ============================================================================
    function openAddStudentModal() {
      crudMode = "create";
      document.getElementById("studentModalTitle").innerText = "Add New Student Record";
      
      document.getElementById("mStudentName").value = "";
      document.getElementById("mStudentEmail").value = "";
      document.getElementById("mStudentReg").value = "";
      document.getElementById("mStudentReg").disabled = false;
      document.getElementById("mStudentAdm").value = "";
      document.getElementById("mStudentAdm").disabled = false;
      document.getElementById("mStudentBranch").value = "ECE";
      document.getElementById("mStudentYear").value = "2024";
      document.getElementById("mStudentSem").value = "S3";
      document.getElementById("mStudentPassword").value = "password123";
      mStudentBase64Photo = "";
      document.getElementById("mPhotoPreviewContainer").classList.add("hidden");
      
      document.getElementById("studentCrudModal").classList.remove("hidden");
      document.getElementById("studentCrudModal").classList.add("flex");
    }

    function openEditStudentModal(regNo) {
      crudMode = "edit";
      document.getElementById("studentModalTitle").innerText = `Edit Student Profile (${regNo})`;
      
      const s = masterStudentsList.find(stud => stud.Reg_No === regNo);
      if (!s) return;
      
      document.getElementById("mStudentName").value = s.Name;
      document.getElementById("mStudentEmail").value = s.Email;
      document.getElementById("mStudentReg").value = s.Reg_No;
      document.getElementById("mStudentReg").disabled = true;
      document.getElementById("mStudentAdm").value = s.Adm_No;
      document.getElementById("mStudentAdm").disabled = true;
      document.getElementById("mStudentBranch").value = s.Branch;
      document.getElementById("mStudentYear").value = s.Year_Of_Admission;
      document.getElementById("mStudentSem").value = s.Semester;
      document.getElementById("mStudentPassword").value = s.Password;
      mStudentBase64Photo = s.Photo_Drive_Link;
      
      const preview = document.getElementById("mPhotoPreview");
      preview.src = s.Photo_Drive_Link;
      document.getElementById("mPhotoPreviewContainer").classList.remove("hidden");

      document.getElementById("studentCrudModal").classList.remove("hidden");
      document.getElementById("studentCrudModal").classList.add("flex");
    }

    function closeStudentModal() {
      document.getElementById("studentCrudModal").classList.add("hidden");
      document.getElementById("studentCrudModal").classList.remove("flex");
    }

    function convertStudentPhotoToBase64() {
      const file = document.getElementById("mStudentPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        mStudentBase64Photo = reader.result;
        document.getElementById("mPhotoPreview").src = mStudentBase64Photo;
        document.getElementById("mPhotoPreviewContainer").classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    }

    function handleStudentCrudSubmit(e) {
      e.preventDefault();
      
      const studentData = {
        name: document.getElementById("mStudentName").value.trim(),
        email: document.getElementById("mStudentEmail").value.trim(),
        regNo: document.getElementById("mStudentReg").value.trim().toUpperCase(),
        admNo: document.getElementById("mStudentAdm").value.trim().toUpperCase(),
        branch: document.getElementById("mStudentBranch").value,
        admissionYear: document.getElementById("mStudentYear").value.trim(),
        semester: document.getElementById("mStudentSem").value,
        password: document.getElementById("mStudentPassword").value.trim(),
        photoUrl: mStudentBase64Photo
      };

      if (crudMode === "create") {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert(response.message);
              closeStudentModal();
              fetchAdminData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .createStudentDirectly(studentData);
      } else {
        const updateData = {
          Name: studentData.name,
          Email: studentData.email,
          Password: studentData.password,
          Branch: studentData.branch,
          Year_Of_Admission: studentData.admissionYear,
          Semester: studentData.semester,
          Photo_Drive_Link: studentData.photoUrl
        };
        
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Student profile updated successfully.");
              closeStudentModal();
              fetchAdminData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .updateStudentProfile(studentData.regNo, updateData);
      }
    }

    function deleteStudent(regNo) {
      if (confirm(`Are you sure you want to permanently delete student ${regNo}? All response logs will be archived.`)) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Student deleted successfully.");
              fetchAdminData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .deleteStudentProfile(regNo);
      }
    }

    // ============================================================================
    // PROFILE SELF SERVICE
    // ============================================================================
    function convertSelfPhotoToBase64() {
      const file = document.getElementById("selfPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        selfProfileBase64Photo = reader.result;
        document.getElementById("selfPhotoPreview").src = selfProfileBase64Photo;
      };
      reader.readAsDataURL(file);
    }

    function handleSelfProfileUpdate(e) {
      e.preventDefault();
      
      const name = document.getElementById("selfName").value.trim();
      const email = document.getElementById("selfEmail").value.trim();
      const password = document.getElementById("selfPassword").value.trim();
      
      const profileData = { name, email };
      if (password) {
        profileData.password = password;
      }
      if (selfProfileBase64Photo) {
        profileData.photoUrl = selfProfileBase64Photo;
      }

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Your profile has been updated successfully.");
            sessionStorage.setItem("userName", name);
            if (selfProfileBase64Photo) {
              sessionStorage.setItem("userPhoto", selfProfileBase64Photo);
            }
            window.location.reload();
          } else {
            alert("Error updating profile: " + response.message);
          }
        })
        .updateStaffProfileSelf(adminMobile, profileData);
    }

    function handleLogout() {
      sessionStorage.clear();
      navigateToPage("Login");
    }
  </script>
</body>
</html>
