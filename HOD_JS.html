  <script>
    const hodMobile = sessionStorage.getItem("userId");
    let hodName = sessionStorage.getItem("userName");
    if (!hodName || hodName === "null" || hodName.trim() === "") {
      hodName = "Department HOD";
    }
    const hodBranch = sessionStorage.getItem("userBranch");
    const hodPhoto = sessionStorage.getItem("userPhoto");
    
    let activeHODView = "approvals";
    let pendingStudents = [];
    let pendingStaff = [];
    let classroomData = [];
    let allApprovedStaff = [];
    let branchStudentRoster = [];
    let branchStaffRoster = [];
    
    let crudMode = "create"; // "create" or "edit"
    let mStudentBase64Photo = "";
    let selfProfileBase64Photo = "";

    // Guard login
    if (!hodMobile) {
      navigateToPage("Login");
    }

    // Init profile UI
    document.getElementById("hodNameText").innerText = hodName;
    document.getElementById("hodBranchText").innerText = getBranchFullName(hodBranch) + " HOD";
    if (hodPhoto) {
      document.getElementById("hodProfilePic").src = hodPhoto;
    }

    // Initial Load
    window.addEventListener("load", function() {
      fetchHODDashboardData();
    });

    function fetchHODDashboardData() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            pendingStudents = response.students.filter(s => s.Branch === hodBranch);
            pendingStaff = response.staff.filter(s => s.Branch === hodBranch);
            allApprovedStaff = response.allApprovedStaff || [];
            
            updatePendingBadges();
            fetchClassrooms();
          }
        })
        .getPendingAccounts();

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS" && response.isSupervisor) {
            const link = document.getElementById("hodNav-tutorPanel");
            if (link) link.classList.remove("hidden");
          }
        })
        .checkStaffSupervisionStatus(hodMobile);
    }

    function fetchClassrooms() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            classroomData = response.classes;
            fetchStudentRoster();
          }
        })
        .getHODClassroomAllocations(hodBranch);
    }

    function fetchStudentRoster() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            branchStudentRoster = response.roster;
            fetchStaffRoster();
          }
        })
        .getHODStudentRoster(hodBranch);
    }

    function fetchStaffRoster() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            branchStaffRoster = response.staff;
            renderHODView();
          }
        })
        .getHODStaffRoster(hodBranch);
    }

    function updatePendingBadges() {
      const badge = document.getElementById("hodPendingBadge");
      const totalPending = pendingStudents.length + pendingStaff.length;
      if (totalPending > 0) {
        badge.innerText = totalPending;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function switchHODView(viewName) {
      activeHODView = viewName;
      
      const navIds = ['approvals', 'classes', 'mapping', 'students', 'staff', 'studentReport', 'obeSetup', 'profile'];
      navIds.forEach(id => {
        const btn = document.getElementById(`hodNav-${id}`);
        if (id === viewName) {
          btn.className = "w-full text-left px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-3 bg-blue-600/15 text-blue-400 transition-premium";
        } else {
          btn.className = "w-full text-left px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-premium";
        }
      });
      
      renderHODView();
    }

    function renderHODView() {
      const container = document.getElementById("hodViewContainer");
      const title = document.getElementById("hodViewTitle");
      const subtext = document.getElementById("hodViewSubtext");
      const actions = document.getElementById("hodViewActions");
      
      actions.innerHTML = "";

      if (activeHODView === "approvals") {
        title.innerText = "Pending Approvals";
        subtext.innerText = "Verify credentials and photos before approving accounts.";
        
        if (pendingStudents.length === 0 && pendingStaff.length === 0) {
          container.innerHTML = `
            <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center">
              <span class="material-symbols-rounded text-5xl text-emerald-500 block mb-3">check_circle</span>
              <h3 class="font-black text-slate-800 text-lg">No Pending Registrations</h3>
              <p class="text-slate-400 text-sm mt-1 max-w-sm mx-auto font-medium">All student and faculty accounts are currently synchronized.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="space-y-6">
            <!-- Students approvals -->
            ${pendingStudents.length > 0 ? `
              <div class="bg-white border rounded-3xl p-6 shadow-sm">
                <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight">Student Accounts (${pendingStudents.length})</h3>
                <div class="space-y-4">
                  ${pendingStudents.map(student => `
                    <div class="flex flex-col md:flex-row items-center justify-between p-4 border rounded-2xl bg-slate-50 gap-4">
                      <div class="flex items-center gap-3">
                        <img src="${student.Photo_Drive_Link}" class="w-12 h-12 rounded-full border object-cover">
                        <div>
                          <span class="font-bold text-sm block text-slate-800">${student.Name}</span>
                          <span class="text-xs text-slate-400 font-semibold">Reg: ${student.Reg_No} | Adm: ${student.Adm_No}</span>
                          <span class="text-xs text-slate-400 font-semibold block">Classroom: ${student.Classroom_ID}</span>
                        </div>
                      </div>
                      <div class="flex gap-2">
                        <button onclick="handleApprove('${student.Reg_No}', 'student')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-premium">Approve</button>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ''}

            <!-- Staff approvals -->
            ${pendingStaff.length > 0 ? `
              <div class="bg-white border rounded-3xl p-6 shadow-sm">
                <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight">Staff Accounts (${pendingStaff.length})</h3>
                <div class="space-y-4">
                  ${pendingStaff.map(staff => `
                    <div class="flex flex-col md:flex-row items-center justify-between p-4 border rounded-2xl bg-slate-50 gap-4">
                      <div class="flex items-center gap-3">
                        <img src="${staff.Photo_Drive_Link}" class="w-12 h-12 rounded-full border object-cover">
                        <div>
                          <span class="font-bold text-sm block text-slate-800">${staff.Name}</span>
                          <span class="text-xs text-slate-400 font-semibold">Mobile ID: ${staff.Mobile_No} | Email: ${staff.Email}</span>
                          <span class="text-xs text-blue-600 font-bold block">Role: ${staff.Designation}</span>
                        </div>
                      </div>
                      <div class="flex gap-2">
                        <button onclick="handleApprove('${staff.Mobile_No}', 'staff')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-premium">Approve</button>
                      </div>
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      } 
      else if (activeHODView === "classes") {
        title.innerText = "Class Allocation & Creation";
        subtext.innerText = "Create virtual classrooms and assign Tutors/Mentors.";
        
        actions.innerHTML = `
          <button onclick="openCreateClassModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-blue-500/10 flex items-center justify-center gap-1">
            <span class="material-symbols-rounded text-sm">add</span> Create Class Group
          </button>
        `;

        const eligibleTutors = branchStaffRoster.filter(s => s.Designation === "Lecturer" || s.Designation === "HOD");

        container.innerHTML = `
          <!-- Tutors Assignment Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            ${classroomData.map(c => `
              <div class="bg-white border rounded-3xl p-6 shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-center pb-2 border-b">
                    <span class="text-xs bg-slate-100 text-slate-600 font-black px-2.5 py-0.5 rounded-full">${c.classroomId}</span>
                    <span class="text-xs text-slate-400 font-bold">Batch: ${c.batchYear}</span>
                  </div>
                  
                  <div class="mt-4 space-y-3">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                      <span>Assigned Tutor:</span>
                      <span class="text-blue-600">${c.tutorName}</span>
                    </div>
                  </div>
                </div>

                <div class="mt-6 border-t pt-4 space-y-3">
                  <h4 class="text-xs font-black text-slate-800">Class Supervision Settings</h4>
                  <form onsubmit="handleTutorAllocation(event, '${c.classroomId}')" class="flex gap-2">
                    <select id="tutorSelect-${c.classroomId}" class="flex-grow bg-slate-50 border rounded-xl px-2 py-1.5 text-[10px] font-bold text-slate-700 focus:outline-none">
                      <option value="">Select Tutor</option>
                      ${eligibleTutors.map(t => `<option value="${t.Mobile_No}" ${t.Mobile_No === c.tutorMobile ? 'selected' : ''}>${t.Name}</option>`).join("")}
                    </select>
                    <button type="submit" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-[10px] font-black transition-premium">Save Tutor</button>
                  </form>
                  <button onclick="openMentorAllocationModal('${c.classroomId}')" class="w-full py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-[10px] font-black transition-premium flex items-center justify-center gap-1.5">
                    <span class="material-symbols-rounded text-sm">supervisor_account</span> Assign Mentors
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      } 
      else if (activeHODView === "mapping") {
        title.innerText = "Faculty Subject Mapping";
        subtext.innerText = "Map lecturers and demonstrators to specific subject rooms.";
        
        const eligibleFaculty = branchStaffRoster.filter(s => s.Designation !== "Super_Admin" && s.Designation !== "Office_Staff");
        const collegeStaffList = allApprovedStaff.filter(s => s.Branch !== hodBranch && s.Designation !== "Super_Admin");

        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Card 1: Create Subject Room Assignment -->
            <div class="bg-white border rounded-3xl p-6 shadow-sm">
              <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Create Subject Room Assignment</h3>
              <form onsubmit="handleFacultyMapping(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Classroom</label>
                  <select id="mapClassSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                    ${classroomData.map(c => `<option value="${c.classroomId}">${c.classroomId}</option>`).join("")}
                  </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Subject Code</label>
                    <input type="text" id="mapSubCode" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="e.g. EC201">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Subject Name</label>
                    <input type="text" id="mapSubName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="e.g. Network Theory">
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Course Type</label>
                  <select id="mapCourseType" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                    <option value="Theory">Theory Course</option>
                    <option value="Laboratory">Laboratory / Practical</option>
                    <option value="Drawing">Engineering Drawing</option>
                    <option value="Project">Project Work</option>
                    <option value="Seminar">Seminar Presentation</option>
                    <option value="Practicum (Lab Based Theory)">Practicum (Lab Based Theory)</option>
                    <option value="Project Based Theory">Project Based Theory</option>
                    <option value="Internship">Internship Portfolio</option>
                    <option value="Physical Education">Physical Education</option>
                    <option value="Language Lab">Language Lab</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Assign Subject Teacher / Faculty</label>
                  <select id="mapFacultySelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                    ${eligibleFaculty.map(f => `<option value="${f.Mobile_No}">${f.Name} (${f.Mobile_No})</option>`).join("")}
                  </select>
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition-premium text-xs">
                  Save Faculty Assignment
                </button>
              </form>
            </div>

            <!-- Card 2: Inter-Branch Faculty Mapping -->
            <div class="bg-white border rounded-3xl p-6 shadow-sm flex flex-col justify-between">
              <div>
                <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Link Inter-Branch Faculty</h3>
                <form onsubmit="handleInterBranchAssign(event)" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Select College Faculty</label>
                    <select id="interStaffSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                      <option value="">Select Faculty Member</option>
                      ${collegeStaffList.map(s => `<option value="${s.Mobile_No}">${s.Name} (${s.Designation} - ${s.Branch})</option>`).join("")}
                    </select>
                  </div>
                  <button type="submit" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow-lg transition-premium text-xs">
                    Link Faculty to Department
                  </button>
                </form>
              </div>

              <!-- List of linked inter-branch faculties -->
              <div class="mt-6 border-t pt-4">
                <h4 class="text-xs font-black text-slate-800 mb-2">Currently Linked Inter-Branch Staff</h4>
                <div class="space-y-2 max-h-[180px] overflow-y-auto pr-1">
                  ${branchStaffRoster.filter(s => s.Branch !== hodBranch).length === 0 ? `
                    <p class="text-[10px] text-slate-400 font-bold">No inter-branch staff linked currently.</p>
                  ` : branchStaffRoster.filter(s => s.Branch !== hodBranch).map(s => `
                    <div class="flex items-center justify-between p-2 border rounded-xl bg-slate-50 text-[10px] font-bold">
                      <div>
                        <span class="text-slate-800 block">${s.Name}</span>
                        <span class="text-slate-400 uppercase">Branch: ${s.Branch} | ${s.Designation}</span>
                      </div>
                      <button onclick="handleRemoveInterBranch('${s.Mobile_No}')" class="text-red-500 hover:text-red-700 font-black">Remove</button>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
          </div>
        `;
      } 
      else if (activeHODView === "students") {
        title.innerText = "Department Student Manager";
        subtext.innerText = "Manage, edit, create, and delete student records in your department.";
        
        actions.innerHTML = `
          <button onclick="openAddStudentModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-blue-500/10 flex items-center justify-center gap-1">
            <span class="material-symbols-rounded text-sm">add</span> Add Student Record
          </button>
        `;
        
        if (branchStudentRoster.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-xs font-bold py-6 text-center bg-white border rounded-3xl">No students registered in ${hodBranch} branch.</p>`;
          return;
        }

        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-bold">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider">
                    <th class="p-3 w-16">Photo</th>
                    <th class="p-3">Register No</th>
                    <th class="p-3">Admission No</th>
                    <th class="p-3">Student Name</th>
                    <th class="p-3">Classroom Group</th>
                    <th class="p-3">Status</th>
                    <th class="p-3 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody class="text-slate-600">
                  ${branchStudentRoster.map(s => `
                    <tr class="border-b hover:bg-slate-50">
                      <td class="p-3">
                        <img src="${s.Photo_Drive_Link}" class="w-10 h-10 rounded-full object-cover border">
                      </td>
                      <td class="p-3 font-mono">${s.Reg_No}</td>
                      <td class="p-3 font-mono">${s.Adm_No}</td>
                      <td class="p-3 text-slate-800">${s.Name}</td>
                      <td class="p-3 text-slate-400">${s.Classroom_ID}</td>
                      <td class="p-3">
                        <span class="px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase ${s.Status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                          ${s.Status}
                        </span>
                      </td>
                      <td class="p-2 text-center space-x-2">
                        <button onclick="openEditStudentModal('${s.Reg_No}')" class="px-2.5 py-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-premium">Edit</button>
                        <button onclick="deleteStudent('${s.Reg_No}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-premium">Delete</button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
      else if (activeHODView === "staff") {
        title.innerText = "Department Staff Manager";
        subtext.innerText = "Assign roles, audit faculty, and deregister staff members.";
        
        actions.innerHTML = `
          <button onclick="openAddStaffModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-blue-500/10 flex items-center justify-center gap-1">
            <span class="material-symbols-rounded text-sm">person_add</span> Add Staff Member
          </button>
        `;
        
        if (branchStaffRoster.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-xs font-bold py-6 text-center bg-white border rounded-3xl">No staff registered in your branch.</p>`;
          return;
        }

        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-bold">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider">
                    <th class="p-3 w-16">Photo</th>
                    <th class="p-3">Mobile ID</th>
                    <th class="p-3">Staff Name</th>
                    <th class="p-3">Email Address</th>
                    <th class="p-3">Designation</th>
                    <th class="p-3">Status</th>
                    <th class="p-3 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody class="text-slate-600">
                  ${branchStaffRoster.map(s => `
                    <tr class="border-b hover:bg-slate-50">
                      <td class="p-3">
                        <img src="${s.Photo_Drive_Link}" class="w-10 h-10 rounded-full object-cover border">
                      </td>
                      <td class="p-3 font-mono">${s.Mobile_No}</td>
                      <td class="p-3 text-slate-800">${s.Name}</td>
                      <td class="p-3 text-slate-400">${s.Email}</td>
                      <td class="p-3 text-blue-600 uppercase">${s.Designation}</td>
                      <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ${s.Account_Status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                          ${s.Account_Status}
                        </span>
                      </td>
                      <td class="p-2 text-center">
                        ${s.Mobile_No === hodMobile ? `
                          <span class="text-slate-400 text-[10px] italic">Logged In</span>
                        ` : `
                          <button onclick="deregisterStaff('${s.Mobile_No}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-premium">Deregister</button>
                        `}
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
      else if (activeHODView === "studentReport") {
        title.innerText = "Student Progress Card Generator";
        subtext.innerText = "Generate and print parent-teacher progress scorecard for any student in your branch.";
        
        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Selectors Panel -->
            <div class="bg-white border rounded-3xl p-6 shadow-sm h-fit space-y-4 print:hidden">
              <h3 class="text-base font-black text-slate-800 mb-2 border-b pb-2 tracking-tight">Report Controls</h3>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Classroom</label>
                <select id="rptClassSelect" onchange="handleRptClassChange()" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                  <option value="">Select Class</option>
                  ${classroomData.map(c => `<option value="${c.classroomId}">${c.classroomId}</option>`).join("")}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Subject</label>
                <select id="rptSubjectSelect" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                  <option value="">Select Subject</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Student</label>
                <select id="rptStudentSelect" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                  <option value="">Select Student</option>
                </select>
              </div>
              <button onclick="generateHODStudentReportCard()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium">Generate Report Card</button>
            </div>

            <!-- Report Card Output -->
            <div class="lg:col-span-2" id="hodReportWrapper">
              <p class="text-slate-400 text-xs font-bold py-6 text-center bg-white border rounded-3xl print:hidden">Configure filters and click generate.</p>
            </div>
          </div>
        `;
      }
      else if (activeHODView === "obeSetup") {
        title.innerText = "Departmental OBE Setup Console";
        subtext.innerText = "Define department vision, mission statements, Program Educational Objectives (PEOs), and Program Specific Outcomes (PSOs).";
        
        container.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm max-w-2xl mx-auto">

    function handleRptClassChange() {
      const classId = document.getElementById("rptClassSelect").value;
      const subSelect = document.getElementById("rptSubjectSelect");
      const studSelect = document.getElementById("rptStudentSelect");
      
      subSelect.innerHTML = `<option value="">Loading...</option>`;
      studSelect.innerHTML = `<option value="">Loading...</option>`;
      
      if (!classId) {
        subSelect.innerHTML = `<option value="">Select Classroom</option>`;
        studSelect.innerHTML = `<option value="">Select Student</option>`;
        return;
      }
      
      // Load classroom subjects from HOD classroom mappings list
      const matchedClass = classroomData.find(c => c.classroomId === classId);
      if (matchedClass) {
        subSelect.innerHTML = matchedClass.subjects.map(s => `
          <option value="${s.code}">${s.code} - ${s.name}</option>
        `).join("");
      }
      
      // Fetch students roster in classroom
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {

              studSelect.innerHTML = `<option value="">No students in class</option>`;
            } else {
              studSelect.innerHTML = response.students.map(s => `

            }
          }
        })
        .getStudentsInClass(classId);

                      <div>Student Name: <span class="text-slate-900 font-extrabold block text-sm">${response.student.name}</span></div>
                      <div>Register No: <span class="text-slate-900 block font-mono text-sm">${response.student.regNo}</span></div>
                      <div>Classroom: <span class="text-slate-500 block">${response.student.classroom}</span></div>

      reader.readAsDataURL(file);

          Year_Of_Admission: studentData.admissionYear,
          Semester: studentData.semester,
          Photo_Drive_Link: studentData.photoUrl
        };
        
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Student profile updated successfully.");
              closeStudentModal();
              fetchHODDashboardData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .updateStudentProfile(studentData.regNo, updateData);
      }
    }

    function deleteStudent(regNo) {
      if (confirm(`Are you sure you want to permanently delete student ${regNo}? All response logs will be archived.`)) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Student deleted successfully.");
              fetchHODDashboardData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .deleteStudentProfile(regNo);
      }
    }

    // ============================================================================
    // STAFF MANAGEMENT CONTROLLER
    // ============================================================================
    function deregisterStaff(mobileNo) {
      if (confirm(`Are you sure you want to deregister staff member with ID ${mobileNo}? They will lose access immediately.`)) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Staff member successfully deregistered.");
              fetchHODDashboardData();
            }
          })
          .deregisterStaffMember(mobileNo);
      }
    }

    // ============================================================================
    // PROFILE SELF SERVICE
    // ============================================================================
    function convertSelfPhotoToBase64() {
      const file = document.getElementById("selfPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        selfProfileBase64Photo = reader.result;
        document.getElementById("selfPhotoPreview").src = selfProfileBase64Photo;
      };
      reader.readAsDataURL(file);
    }

    function handleSelfProfileUpdate(e) {
      e.preventDefault();
      
      const name = document.getElementById("selfName").value.trim();
      const email = document.getElementById("selfEmail").value.trim();
      const password = document.getElementById("selfPassword").value.trim();
      
      const profileData = { name, email };
      if (password) {
        profileData.password = password;
      }
      if (selfProfileBase64Photo) {
        profileData.photoUrl = selfProfileBase64Photo;
      }

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Your profile has been updated successfully.");
            
            // Update session values
            sessionStorage.setItem("userName", name);
            if (selfProfileBase64Photo) {
              sessionStorage.setItem("userPhoto", selfProfileBase64Photo);
            }
            
            window.location.reload();
          } else {
            alert("Error updating profile: " + response.message);
          }
        })
        .updateStaffProfileSelf(hodMobile, profileData);
    }

    // ============================================================================
    // MOCK STAFF ADDITION CONTROLLERS
    // ============================================================================
    let staffModalMode = "register";
    let mStaffBase64Photo = "";

    function openAddStaffModal() {
      staffModalMode = "register";
      mStaffBase64Photo = "";
      document.getElementById("staffSec-register").classList.remove("hidden");
      document.getElementById("staffSec-link").classList.add("hidden");
      document.getElementById("staffTab-register").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-sm transition-premium";
      document.getElementById("staffTab-link").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition-premium";
      
      // Clear inputs
      document.getElementById("mStaffName").value = "";
      document.getElementById("mStaffEmail").value = "";
      document.getElementById("mStaffMobile").value = "";
      document.getElementById("mStaffDesig").value = "Lecturer";
      document.getElementById("mStaffPassword").value = "password123";
      document.getElementById("mStaffPhoto").value = "";
      document.getElementById("mStaffPhotoPreviewContainer").classList.add("hidden");
      document.getElementById("mStaffPhotoPreview").src = "";
      
      // Populate link dropdown
      const collegeStaffList = allApprovedStaff.filter(s => s.Branch !== hodBranch && s.Designation !== "Super_Admin");
      const select = document.getElementById("mLinkStaffSelect");
      select.innerHTML = `<option value="">Select Faculty Member</option>` + collegeStaffList.map(s => `
        <option value="${s.Mobile_No}">${s.Name} (${s.Designation} - ${s.Branch})</option>
      `).join("");
      
      document.getElementById("staffCrudModal").classList.remove("hidden");
      document.getElementById("staffCrudModal").classList.add("flex");
    }

    function closeStaffModal() {
      document.getElementById("staffCrudModal").classList.add("hidden");
      document.getElementById("staffCrudModal").classList.remove("flex");
    }

    function setStaffModalMode(mode) {
      staffModalMode = mode;
      if (mode === "register") {
        document.getElementById("staffSec-register").classList.remove("hidden");
        document.getElementById("staffSec-link").classList.add("hidden");
        document.getElementById("staffTab-register").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-sm transition-premium";
        document.getElementById("staffTab-link").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition-premium";
      } else {
        document.getElementById("staffSec-register").classList.add("hidden");
        document.getElementById("staffSec-link").classList.remove("hidden");
        document.getElementById("staffTab-register").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition-premium";
        document.getElementById("staffTab-link").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-sm transition-premium";
      }
    }

    function convertStaffPhotoToBase64() {
      const file = document.getElementById("mStaffPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        mStaffBase64Photo = reader.result;
        document.getElementById("mStaffPhotoPreviewContainer").classList.remove("hidden");
        document.getElementById("mStaffPhotoPreview").src = mStaffBase64Photo;
      };
      reader.readAsDataURL(file);
    }

    function handleStaffCrudSubmit(e) {
      e.preventDefault();
      
      if (staffModalMode === "register") {
        const name = document.getElementById("mStaffName").value.trim();
        const email = document.getElementById("mStaffEmail").value.trim();
        const mobileNo = document.getElementById("mStaffMobile").value.trim();
        const designation = document.getElementById("mStaffDesig").value;
        const password = document.getElementById("mStaffPassword").value.trim();
        
        if (!name || !email || !mobileNo || !password) {
          alert("Please fill in all required fields.");
          return;
        }
        
        const staffData = {
          name: name,
          email: email,
          mobileNo: mobileNo,
          branch: hodBranch,
          designation: designation,
          password: password,
          photoUrl: mStaffBase64Photo
        };
        
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert(response.message);
              closeStaffModal();
              fetchHODDashboardData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .createStaffDirectly(staffData);
      } else {
        const staffMobile = document.getElementById("mLinkStaffSelect").value;
        if (!staffMobile) {
          alert("Please select a faculty member to link.");
          return;
        }
        
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Faculty member linked to your department successfully!");
              closeStaffModal();
              fetchHODDashboardData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .assignStaffToBranch(staffMobile, hodBranch);
      }
    }

    // ============================================================================
    // MENTOR ALLOCATION CONTROLLERS
    // ============================================================================
    let currentAllocationClassId = "";
    let allocationClassStudents = [];

    function openMentorAllocationModal(classroomId) {
      currentAllocationClassId = classroomId;
      
      // Populate eligible mentors dropdown (Lecturer, Demonstrator, HOD)
      const eligibleMentors = branchStaffRoster.filter(s => s.Designation === "Lecturer" || s.Designation === "Demonstrator" || s.Designation === "HOD");
      const mentorSelect = document.getElementById("allocationMentorSelect");
      mentorSelect.innerHTML = `<option value="">Select Mentor</option>` + eligibleMentors.map(m => `
        <option value="${m.Mobile_No}">${m.Name} (${m.Designation})</option>
      `).join("");
      
      // Clear student checkboxes list
      document.getElementById("allocationStudentList").innerHTML = `<p class="text-[10px] text-slate-400 font-bold">Select a mentor first.</p>`;
      
      // Load all students in the classroom
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            allocationClassStudents = response.students || [];
            allocationClassStudents.sort((a, b) => {
              const regA = (a.Reg_No || "").toString().toUpperCase();
              const regB = (b.Reg_No || "").toString().toUpperCase();
              return regA.localeCompare(regB, undefined, { numeric: true, sensitivity: 'base' });
            });
            
            document.getElementById("mentorAllocationModal").classList.remove("hidden");
            document.getElementById("mentorAllocationModal").classList.add("flex");
          } else {
            alert("Error loading students: " + response.message);
          }
        })
        .getStudentsInClass(classroomId);
    }

    function closeMentorAllocationModal() {
      document.getElementById("mentorAllocationModal").classList.add("hidden");
      document.getElementById("mentorAllocationModal").classList.remove("flex");
    }

    function loadMentorStudentCheckboxes() {
      const mentorMobile = document.getElementById("allocationMentorSelect").value;
      const listDiv = document.getElementById("allocationStudentList");
      if (!mentorMobile) {
        listDiv.innerHTML = `<p class="text-[10px] text-slate-400 font-bold">Select a mentor first.</p>`;
        return;
      }
      
      if (allocationClassStudents.length === 0) {
        listDiv.innerHTML = `<p class="text-[10px] text-slate-400 font-bold">No students in this class.</p>`;
        return;
      }
      
      listDiv.innerHTML = allocationClassStudents.map(s => {
        const isChecked = s.Mentor_Mobile_No === mentorMobile;
        const hasOtherMentor = s.Mentor_Mobile_No && s.Mentor_Mobile_No !== mentorMobile;
        let labelSuffix = "";
        if (hasOtherMentor) {
          const mInfo = allApprovedStaff.find(st => st.Mobile_No === s.Mentor_Mobile_No);
          labelSuffix = ` <span class="text-[9px] text-amber-600 font-bold">(Assigned to ${mInfo ? mInfo.Name : s.Mentor_Mobile_No})</span>`;
        }
        
        return `
          <label class="flex items-center gap-3 p-2 rounded-xl hover:bg-white cursor-pointer text-xs font-bold text-slate-700">
            <input type="checkbox" name="allocStudentCheckbox" value="${s.Reg_No}" ${isChecked ? 'checked' : ''} class="w-4 h-4 text-blue-600 rounded border-slate-300">
            <span>${s.Name} (${s.Reg_No})${labelSuffix}</span>
          </label>
        `;
      }).join("");
    }

    function submitMentorAllocation() {
      const mentorMobile = document.getElementById("allocationMentorSelect").value;
      if (!mentorMobile) {
        alert("Please select a mentor first.");
        return;
      }
      
      const checkboxes = document.getElementsByName("allocStudentCheckbox");
      const selectedRegNos = [];
      for (let cb of checkboxes) {
        if (cb.checked) {
          selectedRegNos.push(cb.value);
        }
      }
      
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert(response.message);
            closeMentorAllocationModal();
            fetchHODDashboardData();
          } else {
            alert("Error: " + response.message);
          }
        })
        .assignMentorToStudents(currentAllocationClassId, mentorMobile, selectedRegNos);
    }

    function handleLogout() {
      sessionStorage.clear();
      navigateToPage("Login");
    }
  </script>
</body>
