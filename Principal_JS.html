  <script>
    // State variables
    const principalMobile = sessionStorage.getItem("userId");
    let principalName = sessionStorage.getItem("userName");
    if (!principalName || principalName === "null" || principalName.trim() === "") {
      principalName = "College Principal";
    }
    const principalPhoto = sessionStorage.getItem("userPhoto");

    let activeMainView = "adminDesk";
    let activeAdminSubView = "staffApp";
    let activeHODSubView = "classes";
    let activeFacultySubView = "subjects";

    // Dynamic Lists loaded from server
    let pendingStudents = [];
    let pendingStaff = [];
    let allApprovedStaff = [];
    let auditLogs = [];
    let collegeClasses = [];

    // HOD desk selections
    let selectedBranch = "EL";
    let branchStudentRoster = [];
    let branchStaffRoster = [];
    let classroomData = [];

    // Faculty desk selections
    let selectedClassroomId = "";
    let selectedSubjectCode = "";
    let selectedCourseType = "Theory";
    let activeClassRoster = [];
    let activeMarksRoster = [];
    let activeClassLogRoster = [];
    let pendingAIReviews = [];
    let activeAttainmentThreshold = 50;

    // CRUD state helpers
    let crudMode = "create";
    let mStudentBase64Photo = "";
    let mStaffBase64Photo = "";
    let staffModalMode = "register";
    let selfProfileBase64Photo = "";

    // Guard login
    if (!principalMobile) {
      navigateToPage("Login");
    }

    document.getElementById("principalNameText").innerText = principalName;
    if (principalPhoto) {
      document.getElementById("principalProfilePic").src = principalPhoto;
    }

    window.addEventListener("load", function() {
      fetchPrincipalData();
    });

    function fetchPrincipalData() {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            pendingStudents = response.pendingStudents || [];
            pendingStaff = response.pendingStaff || [];
            allApprovedStaff = response.allApprovedStaff || [];
            auditLogs = response.logs || [];
            collegeClasses = response.classes || [];

            // Set badge alert count
            const badge = document.getElementById("principalPendingBadge");
            const total = pendingStudents.length + pendingStaff.length;
            if (total > 0) {
              badge.innerText = total;
              badge.classList.remove("hidden");
            } else {
              badge.classList.add("hidden");
            }

            // Sync selectors and render default views
            populateFacultyClassSelector();
            handlePrincipalBranchChange();
            renderActiveView();
          }
        })
        .getPrincipalDashboardData();
    }

    function switchMainView(viewId) {
      activeMainView = viewId;
      const navs = ["adminDesk", "hodDesk", "facultyDesk", "profile"];
      navs.forEach(n => {
        const btn = document.getElementById(`nav-${n}`);
        if (n === viewId) {
          btn.className = "w-full text-left px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-3 bg-blue-600/15 text-blue-400 transition-premium";
        } else {
          btn.className = "w-full text-left px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-3 text-slate-400 hover:bg-slate-800 hover:text-white transition-premium";
        }
      });
      renderActiveView();
    }

    function renderActiveView() {
      const title = document.getElementById("viewTitle");
      const subtext = document.getElementById("viewSubtext");
      const actions = document.getElementById("viewActions");
      actions.innerHTML = "";

      if (activeMainView === "adminDesk") {
        title.innerText = "Administrative Desk";
        subtext.innerText = "Verify approvals queue, student database, password resets, and activity logs.";
        renderAdminDesk();
      } else if (activeMainView === "hodDesk") {
        title.innerText = "Academic Departments Console";
        subtext.innerText = "Manage departments, linked inter-branch faculties, syllabus mappings, and student records.";
        renderHODDesk();
      } else if (activeMainView === "facultyDesk") {
        title.innerText = "Faculty Subject Rooms";
        subtext.innerText = "Inspect class lesson plans, daily logs, outcome attainment reports, and student portfolios.";
        renderFacultyDesk();
      } else if (activeMainView === "profile") {
        title.innerText = "My Profile Settings";
        subtext.innerText = "Update your credentials, administrator email, or password.";
        renderProfileDesk();
      }
    }

    // ============================================================================
    // ADMINISTRATIVE DESK
    // ============================================================================
    function renderAdminDesk() {
      const container = document.getElementById("viewContainer");
      
      container.innerHTML = `
        <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200 max-w-lg">
          <button onclick="switchAdminSubView('staffApp')" id="adminSubNav-staffApp" class="flex-1 py-2 rounded-xl font-bold text-xs transition-premium">Staff Approvals (${pendingStaff.length})</button>
          <button onclick="switchAdminSubView('students')" id="adminSubNav-students" class="flex-1 py-2 rounded-xl font-bold text-xs transition-premium">Student Master</button>
          <button onclick="switchAdminSubView('passReset')" id="adminSubNav-passReset" class="flex-1 py-2 rounded-xl font-bold text-xs transition-premium">Password Reset</button>
          <button onclick="switchAdminSubView('audit')" id="adminSubNav-audit" class="flex-1 py-2 rounded-xl font-bold text-xs transition-premium">Audit Logs</button>
        </div>
        <div id="adminDeskContent" class="fade-in"></div>
      `;

      switchAdminSubView(activeAdminSubView);
    }

    function switchAdminSubView(subViewId) {
      activeAdminSubView = subViewId;
      const subTabs = ["staffApp", "students", "passReset", "audit"];
      subTabs.forEach(tab => {
        const btn = document.getElementById(`adminSubNav-${tab}`);
        if (!btn) return;
        if (tab === subViewId) {
          btn.className = "flex-1 py-2 rounded-xl font-bold text-xs text-blue-600 bg-white shadow-sm transition-premium";
        } else {
          btn.className = "flex-1 py-2 rounded-xl font-bold text-xs text-slate-500 hover:text-slate-800 transition-premium";
        }
      });

      const content = document.getElementById("adminDeskContent");
      if (subViewId === "staffApp") {
        if (pendingStaff.length === 0) {
          content.innerHTML = `
            <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center max-w-md mx-auto">
              <span class="material-symbols-rounded text-5xl text-emerald-500 block mb-3">check_circle</span>
              <h3 class="font-black text-slate-800 text-lg">No Pending Registrations</h3>
              <p class="text-slate-400 text-sm mt-1 font-semibold">All staff registrations are approved.</p>
            </div>
          `;
          return;
        }
        content.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Pending Staff Approvals</h3>
            <div class="space-y-4">
              ${pendingStaff.map(staff => `
                <div class="flex flex-col md:flex-row items-center justify-between p-4 border rounded-2xl bg-slate-50 gap-4">
                  <div class="flex items-center gap-3">
                    <img src="${staff.Photo_Drive_Link}" class="w-12 h-12 rounded-full border object-cover">
                    <div>
                      <span class="font-bold text-sm block text-slate-800">${staff.Name}</span>
                      <span class="text-xs text-slate-400 font-semibold">Mobile ID: ${staff.Mobile_No} | Email: ${staff.Email}</span>
                      <span class="text-xs text-blue-600 font-bold block uppercase mt-0.5">Role: ${staff.Designation} | Branch: ${staff.Branch}</span>
                    </div>
                  </div>
                  <button onclick="approveStaffUser('${staff.Mobile_No}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-premium shadow-md shadow-emerald-500/10">Approve Access</button>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      } 
      else if (subViewId === "students") {
        document.getElementById("viewActions").innerHTML = `
          <button onclick="openAddStudentModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium">➕ Add Student</button>
        `;
        content.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
              <h3 class="text-base font-black text-slate-800 tracking-tight">Student Database Registry</h3>
              <input type="text" id="principalStudentSearch" onkeyup="filterStudentTable()" placeholder="Search registry..." class="bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-bold" id="principalStudentsTable">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider">
                    <th class="p-3 w-16">Photo</th>
                    <th class="p-3">Register No</th>
                    <th class="p-3">Admission No</th>
                    <th class="p-3">Student Name</th>
                    <th class="p-3">Branch</th>
                    <th class="p-3">Classroom Group</th>
                    <th class="p-3">Status</th>
                    <th class="p-3 text-center">Actions</th>
                  </tr>
                </thead>
                <tbody class="text-slate-600" id="principalStudentListRows">
                  <tr><td colspan="8" class="p-6 text-center text-slate-400">Loading Student Registry data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
        loadStudentsMasterList();
      }
      else if (subViewId === "passReset") {
        content.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm max-w-md mx-auto">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Force Reset User Credentials</h3>
            <form onsubmit="handleForceReset(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Account ID (Register No / Mobile No)</label>
                <input type="text" id="resetTargetId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="e.g. REG24EC01">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Account Type</label>
                <select id="resetTargetType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none">
                  <option value="student">Student</option>
                  <option value="staff">Staff Member</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">New Password</label>
                <input type="text" id="resetNewPassword" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" value="Welcome@123">
              </div>
              <button type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow-lg transition-premium text-xs">Override & Save Credentials</button>
            </form>
          </div>
        `;
      }
      else if (subViewId === "audit") {
        if (auditLogs.length === 0) {
          content.innerHTML = `<p class="text-slate-400 text-xs font-bold py-6 text-center bg-white border rounded-3xl">No logs recorded in the system yet.</p>`;
          return;
        }
        content.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm">
            <h3 class="text-base font-black text-slate-800 mb-4 border-b pb-2 tracking-tight">Security Audit Trail</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-bold">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider">
                    <th class="p-3">Log ID</th>
                    <th class="p-3">User ID</th>
                    <th class="p-3">Action</th>
                    <th class="p-3">Details</th>
                    <th class="p-3">Timestamp</th>
                  </tr>
                </thead>
                <tbody class="text-slate-600">
                  ${auditLogs.map(log => {
                    let actionBadge = "bg-slate-100 text-slate-700";
                    if (log.Action === "Tab_Switch_Warning") actionBadge = "bg-red-100 text-red-700";
                    else if (log.Action === "Manual_Submit") actionBadge = "bg-green-100 text-green-700";
                    else if (log.Action === "Login") actionBadge = "bg-blue-100 text-blue-700";

                    return `
                      <tr class="border-b hover:bg-slate-50">
                        <td class="p-3 font-mono text-slate-400">${log.Log_ID}</td>
                        <td class="p-3 font-mono">${log.Reg_No}</td>
                        <td class="p-3">
                          <span class="px-2 py-0.5 rounded-md ${actionBadge} text-[9px] uppercase font-black">${log.Action}</span>
                        </td>
                        <td class="p-3 font-medium text-slate-800">${log.Details}</td>
                        <td class="p-3 text-slate-400 font-mono">${new Date(log.Timestamp).toLocaleString()}</td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    function approveStaffUser(mobileNo) {
      if (confirm("Are you sure you want to approve this faculty account?")) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Staff account approved successfully!");
              fetchPrincipalData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .approveAccount(mobileNo, "staff");
      }
    }

    function loadStudentsMasterList() {
      // Loop over branches and construct roster
      const rowsContainer = document.getElementById("principalStudentListRows");
      if (!rowsContainer) return;

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.status === "SUCCESS") {
            const list = res.students || [];
            if (list.length === 0) {
              rowsContainer.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400">No student profiles registered in system yet.</td></tr>`;
              return;
            }
            rowsContainer.innerHTML = list.map(s => `
              <tr class="border-b hover:bg-slate-50 student-row">
                <td class="p-3">
                  <img src="${s.Photo_Drive_Link}" class="w-10 h-10 rounded-full object-cover border">
                </td>
                <td class="p-3 font-mono student-reg">${s.Reg_No}</td>
                <td class="p-3 font-mono">${s.Adm_No}</td>
                <td class="p-3 text-slate-800 student-name">${s.Name}</td>
                <td class="p-3 uppercase text-blue-600">${s.Branch}</td>
                <td class="p-3 text-slate-400">${s.Classroom_ID}</td>
                <td class="p-3">
                  <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-green-100 text-green-700">Approved</span>
                </td>
                <td class="p-2 text-center space-x-1 whitespace-nowrap">
                  <button onclick="openEditStudentModal('${s.Reg_No}', '${s.Branch}')" class="px-2.5 py-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-premium">Edit</button>
                  <button onclick="deleteStudent('${s.Reg_No}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-premium">Delete</button>
                </td>
              </tr>
            `).join("");
          }
        })
        .getPendingAccounts(); // In Gas, pending accounts loader resolves approved staff list as well
    }

    function filterStudentTable() {
      const q = document.getElementById("principalStudentSearch").value.toLowerCase();
      const rows = document.querySelectorAll(".student-row");
      rows.forEach(r => {
        const name = r.querySelector(".student-name").innerText.toLowerCase();
        const reg = r.querySelector(".student-reg").innerText.toLowerCase();
        if (name.includes(q) || reg.includes(q)) {
          r.style.display = "";
        } else {
          r.style.display = "none";
        }
      });
    }

    function handleForceReset(e) {
      e.preventDefault();
      const targetId = document.getElementById("resetTargetId").value.trim();
      const type = document.getElementById("resetTargetType").value;
      const pw = document.getElementById("resetNewPassword").value.trim();

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Password updated successfully!");
            document.getElementById("resetTargetId").value = "";
          } else {
            alert("Error: " + response.message);
          }
        })
        .overrideUserPassword(targetId, type, pw);
    }

    // ============================================================================
    // ACADEMIC DEPARTMENTS DESK (HOD REPLICATION)
    // ============================================================================
    function renderHODDesk() {
      const container = document.getElementById("viewContainer");
      
      container.innerHTML = `
        <div class="bg-white border rounded-3xl p-6 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Branch/Department:</span>
            <select id="principalBranchSelector" onchange="handlePrincipalBranchChange()" class="bg-slate-100 border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
              <option value="EL">Electronics Engineering (EL)</option>
              <option value="ME">Mechanical Engineering (ME)</option>
              <option value="CE">Civil Engineering (CE)</option>
              <option value="EEE">Electrical & Electronics Engineering (EEE)</option>
              <option value="CT">Computer Engineering (CT)</option>
              <option value="AU">Automobile Engineering (AU)</option>
            </select>
          </div>
          
          <div class="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
            <button onclick="switchHODSubView('classes')" id="hodSubNav-classes" class="py-2 px-4 rounded-xl font-bold text-xs transition-premium">Class Allocations</button>
            <button onclick="switchHODSubView('mapping')" id="hodSubNav-mapping" class="py-2 px-4 rounded-xl font-bold text-xs transition-premium">Faculty Mapping</button>
            <button onclick="switchHODSubView('students')" id="hodSubNav-students" class="py-2 px-4 rounded-xl font-bold text-xs transition-premium">Students</button>
            <button onclick="switchHODSubView('staff')" id="hodSubNav-staff" class="py-2 px-4 rounded-xl font-bold text-xs transition-premium">Staff</button>
            <button onclick="switchHODSubView('studentReport')" id="hodSubNav-studentReport" class="py-2 px-4 rounded-xl font-bold text-xs transition-premium">Report Cards</button>
            <button onclick="switchHODSubView('obeSetup')" id="hodSubNav-obeSetup" class="py-2 px-4 rounded-xl font-bold text-xs transition-premium">OBE Setup</button>
          </div>
        </div>

        <div id="hodDeskContent" class="fade-in"></div>
      `;

      switchHODSubView(activeHODSubView);
    }

    function handlePrincipalBranchChange() {
      const select = document.getElementById("principalBranchSelector");
      if (select) selectedBranch = select.value;
      
      // Update UI and rosters for this branch
      classroomData = collegeClasses.filter(c => c.branch === selectedBranch);

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            branchStudentRoster = response.roster;
            
            google.script.run
              .withSuccessHandler(function(res) {
                if (res.status === "SUCCESS") {
                  branchStaffRoster = res.staff;
                  if (activeMainView === "hodDesk") {
                    renderHODSubViewContent();
                  }
                }
              })
              .getHODStaffRoster(selectedBranch);
          }
        })
        .getHODStudentRoster(selectedBranch);
    }

    function switchHODSubView(subViewId) {
      activeHODSubView = subViewId;
      const subTabs = ["classes", "mapping", "students", "staff", "studentReport", "obeSetup"];
      subTabs.forEach(tab => {
        const btn = document.getElementById(`hodSubNav-${tab}`);
        if (!btn) return;
        if (tab === subViewId) {
          btn.className = "py-2 px-4 rounded-xl font-bold text-xs text-blue-600 bg-white shadow-sm transition-premium";
        } else {
          btn.className = "py-2 px-4 rounded-xl font-bold text-xs text-slate-500 hover:text-slate-800 transition-premium";
        }
      });
      renderHODSubViewContent();
    }

    function renderHODSubViewContent() {
      const content = document.getElementById("hodDeskContent");
      const actions = document.getElementById("viewActions");
      actions.innerHTML = "";
      if (!content) return;

      if (activeHODSubView === "classes") {
        actions.innerHTML = `
          <button onclick="openCreateClassModal()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-premium">Create Classroom Group</button>
        `;
        if (classroomData.length === 0) {
          content.innerHTML = `<p class="text-slate-400 text-xs font-bold py-6 text-center bg-white border rounded-3xl">No classroom containers configured for ${selectedBranch} branch.</p>`;
          return;
        }
        content.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${classroomData.map(c => `
              <div class="bg-white border rounded-3xl p-6 shadow-sm space-y-4 hover:border-slate-350 transition-premium">
                <div class="flex justify-between items-start border-b pb-3">
                  <div>
                    <h3 class="text-base font-extrabold text-slate-800 tracking-tight">${c.classroomId}</h3>
                    <span class="text-[10px] text-slate-400 font-bold uppercase block mt-0.5">Admission Batch: ${c.batchYear}</span>
                  </div>
                  <button onclick="openMentorAllocationModal('${c.classroomId}')" class="px-2.5 py-1.5 border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 text-[10px] font-black uppercase">Assign Mentors</button>
                </div>
                <div class="grid grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
                  <div>Tutor Assigned: <span class="text-slate-900 font-bold block">${c.tutorName}</span></div>
                  <div>Mentor Assigned: <span class="text-slate-900 font-bold block">${c.mentorName}</span></div>
                </div>
                <form onsubmit="handleTutorAllocation(event, '${c.classroomId}')" class="flex gap-2 items-center bg-slate-50 border rounded-2xl p-3">
                  <div class="flex-grow">
                    <select id="tutorSelect-${c.classroomId}" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-[10px] font-bold text-slate-800">
                      <option value="">Select Tutor</option>
                      ${branchStaffRoster.map(s => `<option value="${s.Mobile_No}" ${c.tutorMobile === s.Mobile_No ? 'selected' : ''}>${s.Name}</option>`).join("")}
                    </select>
                  </div>
                  <div class="flex-grow">
                    <select id="mentorSelect-${c.classroomId}" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-[10px] font-bold text-slate-800">
                      <option value="">Select Mentor</option>
                      ${branchStaffRoster.map(s => `<option value="${s.Mobile_No}" ${c.mentorMobile === s.Mobile_No ? 'selected' : ''}>${s.Name}</option>`).join("")}
                    </select>
                  </div>
                  <button type="submit" class="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-[10px] font-bold">Assign</button>
                </form>
                <div>
                  <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider mb-2">Mapped Subjects</h4>
                  <div class="space-y-1.5 text-[11px] font-semibold text-slate-600">
                    ${c.subjects.map(s => `
                      <div class="flex justify-between border-b pb-1">
                        <span>${s.code} - ${s.name}</span>
                        <span class="text-blue-600">${s.facultyName}</span>
                      </div>
                    `).join("")}
                    ${c.subjects.length === 0 ? `<p class="italic text-slate-400">No subject mapping set for this class container.</p>` : ""}
                  </div>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }
      else if (activeHODSubView === "mapping") {
        content.innerHTML = `
          <div class="bg-white border rounded-3xl p-6 shadow-sm max-w-lg mx-auto">
            <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Faculty Subject Mapper</h3>
            <form onsubmit="handleFacultyMapping(event)" class="space-y-4">
              <div>

    function openCreateClassModal() {
      const year = prompt("Enter Batch Year range (e.g. 2024-27):", "2024-27");
      if (!year) return;
      const sem = prompt("Enter target Semester Code (S1-S6):", "S3");
      if (!sem) return;
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Classroom group generated successfully!");
            fetchPrincipalData();
          } else {
            alert("Error: " + response.message);
          }
        })
        .createClassroom(selectedBranch, year, sem);
    }

    function handleTutorAllocation(e, classroomId) {
      e.preventDefault();
      const tutor = document.getElementById(`tutorSelect-${classroomId}`).value;
      const mentor = document.getElementById(`mentorSelect-${classroomId}`).value;
      if (!tutor || !mentor) {
        alert("Please select both a Tutor and a Mentor.");
        return;

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Tutor and Mentor assigned successfully!");
            fetchPrincipalData();
          } else {
            alert("Error: " + response.message);
          }
        })
        .assignTutorAndMentor(classroomId, tutor, mentor);

    function handleFacultyMapping(e) {
      e.preventDefault();
      const classroomId = document.getElementById("mapClassSelect").value;
      const code = document.getElementById("mapSubCode").value.trim().toUpperCase();
      const name = document.getElementById("mapSubName").value.trim();
      const faculty = document.getElementById("mapFacultySelect").value;
      const type = document.getElementById("mapCourseType").value;

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Faculty assigned to subject successfully!");
            document.getElementById("mapSubCode").value = "";
            document.getElementById("mapSubName").value = "";
            fetchPrincipalData();
          } else {
            alert("Error: " + response.message);
          }
        })
        .mapFacultySubject(classroomId, code, name, faculty, type);
    }

      const matched = classroomData.find(c => c.classroomId === classId);

            const marks = response.academicMarks;

            wrapper.innerHTML = `
              <div id="printablePTMCard" class="bg-white border rounded-3xl p-6 md:p-8 shadow-sm flex flex-col gap-6 relative">

                    <div>Classroom: <span class="text-slate-500 block">${response.student.classroom}</span></div>
                    <div>Attendance: <span class="text-blue-600 block">${response.attendance.percentage}% (${response.attendance.present}/${response.attendance.total} Hours)</span></div>

                <div>

                      </tr>
                    </thead>

                    </tbody>
                  </table>
                </div>
              </div>
            `;

            wrapper.innerHTML = `<p class="p-6 text-center text-red-500">${response.message}</p>`;
          }
        })
        .getStudentPTMReport(regNo, subjectCode);

                  <div class="h-24"></div>
                  <h2 class="text-lg font-black text-slate-800 uppercase border-y-2 py-4 my-4">OBE COURSE FILE COMPILATION</h2>
                  <p class="font-bold text-slate-500 mt-1">Subject: ${selectedSubjectCode}</p>

                <div class="page-break pt-8">
                  <h3 class="text-sm font-black text-slate-800 uppercase mb-3 border-b pb-1">1. Curriculum syllabus plans</h3>
                  <table class="w-full text-left border text-[11px] font-bold">
                    <thead>
                      <tr class="bg-slate-50 border-b">
                        <th class="p-2 border-r">Unit</th>
                        <th class="p-2 border-r">Topic details</th>
                        <th class="p-2 border-r">Hours</th>
                        <th class="p-2">Status</th>
                      </tr>
                    </thead>
                    <tbody>${lpRows || '<tr><td colspan="4" class="p-2 text-center">No syllabus logs mapped.</td></tr>'}</tbody>
                  </table>
                </div>
                <div class="page-break pt-8">
                  <h3 class="text-sm font-black text-slate-800 uppercase mb-3 border-b pb-1">2. Class hourly logs</h3>
                  <table class="w-full text-left border text-[11px] font-bold">
                    <thead>
                      <tr class="bg-slate-50 border-b">
                        <th class="p-2 border-r">Date</th>
                        <th class="p-2 border-r">Period</th>
                        <th class="p-2 border-r">Topics Covered</th>

                      </tr>
                    </thead>
                    <tbody>${clRows || '<tr><td colspan="4" class="p-2 text-center">No hour logs found.</td></tr>'}</tbody>
                  </table>
                </div>
                <div class="page-break pt-8">
                  <h3 class="text-sm font-black text-slate-800 uppercase mb-3 border-b pb-1">3. Student attendance grid</h3>
                  <table class="w-full text-left border text-[11px] font-bold">
                    <thead>
                      <tr class="bg-slate-50 border-b">
                        <th class="p-2 border-r">Reg No</th>
                        <th class="p-2 border-r">Name</th>
                        <th class="p-2 border-r">Present hours</th>
                        <th class="p-2">Percentage</th>
                      </tr>
                    </thead>
                    <tbody>${attRows || '<tr><td colspan="4" class="p-2 text-center">No attendance data found.</td></tr>'}</tbody>
                  </table>
                </div>
              </div>
            `;
          } else {
            wrapper.innerHTML = `<p class="p-6 text-center text-red-500">${response.message}</p>`;

        .getCourseFileCompileData(selectedClassroomId, selectedSubjectCode);
    }

    // ============================================================================
    // PROFILE SERVICE & SETTINGS
    // ============================================================================
    function renderProfileDesk() {
      const container = document.getElementById("viewContainer");
      container.innerHTML = `
        <div class="bg-white border rounded-3xl p-6 shadow-sm max-w-lg mx-auto">
          <h3 class="text-base font-black text-slate-800 mb-4 tracking-tight border-b pb-2">Edit Principal Profile</h3>
          <form onsubmit="handleSelfProfileUpdate(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
              <input type="text" id="selfName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" value="${principalName}">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
              <input type="email" id="selfEmail" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="principal@carmelpoly.in">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">New Password (leave empty to keep current)</label>
              <input type="password" id="selfPassword" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 focus:outline-none" placeholder="••••••••">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Replace Avatar Photo</label>
              <input type="file" id="selfPhoto" accept="image/*" onchange="convertSelfPhotoToBase64()" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
              <div class="mt-2 flex justify-center">
                <img id="selfPhotoPreview" src="${principalPhoto || 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=100'}" class="w-20 h-20 rounded-full object-cover border">
              </div>
            </div>
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition-premium text-xs">Save Changes</button>
          </form>
        </div>
      `;
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            const selfData = response.allApprovedStaff.find(s => {
              if (!s.Mobile_No) return false;
              return s.Mobile_No.toString().replace(/[^0-9]/g, '') === principalMobile.toString().replace(/[^0-9]/g, '');
            });
            if (selfData) {
              document.getElementById("selfEmail").value = selfData.Email || "";
            }
          }
        })
        .getPendingAccounts();
    }

    function handleSelfProfileUpdate(e) {
      e.preventDefault();
      const name = document.getElementById("selfName").value.trim();
      const email = document.getElementById("selfEmail").value.trim();
      const password = document.getElementById("selfPassword").value.trim();

      const profileData = { name, email };
      if (password) profileData.password = password;
      if (selfProfileBase64Photo) profileData.photoUrl = selfProfileBase64Photo;

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert("Your profile has been updated successfully.");
            sessionStorage.setItem("userName", name);
            if (selfProfileBase64Photo) {
              sessionStorage.setItem("userPhoto", selfProfileBase64Photo);
            }
            navigateToPage("principal");
          } else {
            alert("Error updating profile: " + response.message);
          }
        })
        .updateStaffProfileSelf(principalMobile, profileData);
    }

    function convertSelfPhotoToBase64() {
      const file = document.getElementById("selfPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        selfProfileBase64Photo = reader.result;
        document.getElementById("selfPhotoPreview").src = selfProfileBase64Photo;
      };
      reader.readAsDataURL(file);
    }

    // ============================================================================
    // MODALS ACTIONS
    // ============================================================================

    // Student Modal controllers
    function openAddStudentModal() {
      crudMode = "create";
      document.getElementById("studentModalTitle").innerText = "Add New Student Record";
      document.getElementById("mStudentName").value = "";
      document.getElementById("mStudentEmail").value = "";
      document.getElementById("mStudentReg").value = "";
      document.getElementById("mStudentReg").disabled = false;
      document.getElementById("mStudentAdm").value = "";
      document.getElementById("mStudentAdm").disabled = false;
      document.getElementById("mStudentBranch").value = selectedBranch;
      document.getElementById("mStudentYear").value = "2024";
      document.getElementById("mStudentSem").value = "S3";
      document.getElementById("mStudentPassword").value = "password123";
      mStudentBase64Photo = "";
      document.getElementById("mPhotoPreviewContainer").classList.add("hidden");
      document.getElementById("studentCrudModal").classList.remove("hidden");
      document.getElementById("studentCrudModal").classList.add("flex");
    }

    function openEditStudentModal(regNo, branch) {
      crudMode = "edit";
      document.getElementById("studentModalTitle").innerText = `Edit Student Profile (${regNo})`;
      
      const roster = activeMainView === "adminDesk" ? masterStudentsList : branchStudentRoster;
      const s = roster.find(stud => stud.Reg_No === regNo);
      if (!s) return;
      
      document.getElementById("mStudentName").value = s.Name;
      document.getElementById("mStudentEmail").value = s.Email;
      document.getElementById("mStudentReg").value = s.Reg_No;
      document.getElementById("mStudentReg").disabled = true;
      document.getElementById("mStudentAdm").value = s.Adm_No;
      document.getElementById("mStudentAdm").disabled = true;
      document.getElementById("mStudentBranch").value = s.Branch;
      document.getElementById("mStudentYear").value = s.Year_Of_Admission || s.Admission_Year || "2024";
      document.getElementById("mStudentSem").value = s.Semester || "S3";
      document.getElementById("mStudentPassword").value = s.Password || "password123";
      mStudentBase64Photo = s.Photo_Drive_Link;
      
      const preview = document.getElementById("mPhotoPreview");
      preview.src = s.Photo_Drive_Link;
      document.getElementById("mPhotoPreviewContainer").classList.remove("hidden");
      
      document.getElementById("studentCrudModal").classList.remove("hidden");
      document.getElementById("studentCrudModal").classList.add("flex");
    }

    function closeStudentModal() {
      document.getElementById("studentCrudModal").classList.add("hidden");
      document.getElementById("studentCrudModal").classList.remove("flex");
    }

    function convertStudentPhotoToBase64() {
      const file = document.getElementById("mStudentPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        mStudentBase64Photo = reader.result;
        document.getElementById("mPhotoPreview").src = mStudentBase64Photo;
        document.getElementById("mPhotoPreviewContainer").classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    }

    function handleStudentCrudSubmit(e) {
      e.preventDefault();
      const studentData = {
        name: document.getElementById("mStudentName").value.trim(),
        email: document.getElementById("mStudentEmail").value.trim(),
        regNo: document.getElementById("mStudentReg").value.trim().toUpperCase(),
        admNo: document.getElementById("mStudentAdm").value.trim().toUpperCase(),
        branch: document.getElementById("mStudentBranch").value,
        admissionYear: document.getElementById("mStudentYear").value.trim(),
        semester: document.getElementById("mStudentSem").value,
        password: document.getElementById("mStudentPassword").value.trim(),
        photoUrl: mStudentBase64Photo
      };

      if (crudMode === "create") {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert(response.message);
              closeStudentModal();
              fetchPrincipalData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .createStudentDirectly(studentData);
      } else {
        const updateData = {
          Name: studentData.name,
          Email: studentData.email,
          Password: studentData.password,
          Branch: studentData.branch,
          Year_Of_Admission: studentData.admissionYear,
          Semester: studentData.semester,
          Photo_Drive_Link: studentData.photoUrl
        };
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Student profile updated successfully.");
              closeStudentModal();
              fetchPrincipalData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .updateStudentProfile(studentData.regNo, updateData);
      }
    }

    function deleteStudent(regNo) {
      if (confirm(`Are you sure you want to permanently delete student ${regNo}?`)) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Student record deleted successfully.");
              fetchPrincipalData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .deleteStudentProfile(regNo);
      }
    }

    // Staff Modal controllers
    function openAddStaffModal() {
      staffModalMode = "register";
      mStaffBase64Photo = "";
      document.getElementById("staffSec-register").classList.remove("hidden");
      document.getElementById("staffSec-link").classList.add("hidden");
      document.getElementById("staffTab-register").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-sm transition-premium";
      document.getElementById("staffTab-link").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition-premium";
      
      document.getElementById("mStaffName").value = "";
      document.getElementById("mStaffEmail").value = "";
      document.getElementById("mStaffMobile").value = "";
      document.getElementById("mStaffDesig").value = "Lecturer";
      document.getElementById("mStaffPassword").value = "password123";
      document.getElementById("mStaffPhoto").value = "";
      document.getElementById("mStaffPhotoPreviewContainer").classList.add("hidden");
      
      const otherStaff = allApprovedStaff.filter(s => s.Branch !== selectedBranch && s.Designation !== "Super_Admin");
      const select = document.getElementById("mLinkStaffSelect");
      select.innerHTML = `<option value="">Select Faculty Member</option>` + otherStaff.map(s => `
        <option value="${s.Mobile_No}">${s.Name} (${s.Designation} - ${s.Branch})</option>
      `).join("");

      document.getElementById("staffCrudModal").classList.remove("hidden");
      document.getElementById("staffCrudModal").classList.add("flex");
    }

    function closeStaffModal() {
      document.getElementById("staffCrudModal").classList.add("hidden");
      document.getElementById("staffCrudModal").classList.remove("flex");
    }

    function setStaffModalMode(mode) {
      staffModalMode = mode;
      if (mode === "register") {
        document.getElementById("staffSec-register").classList.remove("hidden");
        document.getElementById("staffSec-link").classList.add("hidden");
        document.getElementById("staffTab-register").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-sm transition-premium";
        document.getElementById("staffTab-link").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition-premium";
      } else {
        document.getElementById("staffSec-register").classList.add("hidden");
        document.getElementById("staffSec-link").classList.remove("hidden");
        document.getElementById("staffTab-register").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition-premium";
        document.getElementById("staffTab-link").className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-800 bg-white shadow-sm transition-premium";
      }
    }

    function convertStaffPhotoToBase64() {
      const file = document.getElementById("mStaffPhoto").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function() {
        mStaffBase64Photo = reader.result;
        document.getElementById("mStaffPhotoPreviewContainer").classList.remove("hidden");
        document.getElementById("mStaffPhotoPreview").src = mStaffBase64Photo;
      };
      reader.readAsDataURL(file);
    }

    function handleStaffCrudSubmit(e) {
      e.preventDefault();
      if (staffModalMode === "register") {
        const staffData = {
          name: document.getElementById("mStaffName").value.trim(),
          email: document.getElementById("mStaffEmail").value.trim(),
          mobileNo: document.getElementById("mStaffMobile").value.trim(),
          designation: document.getElementById("mStaffDesig").value,
          password: document.getElementById("mStaffPassword").value.trim(),
          branch: selectedBranch,
          photoUrl: mStaffBase64Photo
        };
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert(response.message);
              closeStaffModal();
              fetchPrincipalData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .createStaffDirectly(staffData);
      } else {
        const staffMobile = document.getElementById("mLinkStaffSelect").value;
        if (!staffMobile) return;
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === "SUCCESS") {
              alert("Staff assigned to branch successfully!");
              closeStaffModal();
              fetchPrincipalData();
            } else {
              alert("Error: " + response.message);
            }
          })
          .assignStaffToBranch(staffMobile, selectedBranch);
      }
    }

    // Mentor Allocation controllers
    let currentAllocationClassId = "";
    let allocationClassStudents = [];

    function openMentorAllocationModal(classroomId) {
      currentAllocationClassId = classroomId;
      const eligible = branchStaffRoster.filter(s => s.Designation !== "Super_Admin");
      const select = document.getElementById("allocationMentorSelect");
      select.innerHTML = `<option value="">Select Mentor</option>` + eligible.map(m => `
        <option value="${m.Mobile_No}">${m.Name} (${m.Designation})</option>
      `).join("");

      document.getElementById("allocationStudentList").innerHTML = `<p class="text-xs text-slate-400">Select a mentor first.</p>`;
      
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            allocationClassStudents = response.students || [];
            document.getElementById("mentorAllocationModal").classList.remove("hidden");
            document.getElementById("mentorAllocationModal").classList.add("flex");
          }
        })
        .getStudentsInClass(classroomId);
    }

    function closeMentorAllocationModal() {
      document.getElementById("mentorAllocationModal").classList.add("hidden");
      document.getElementById("mentorAllocationModal").classList.remove("flex");
    }

    function loadMentorStudentCheckboxes() {
      const mentorMobile = document.getElementById("allocationMentorSelect").value;
      const list = document.getElementById("allocationStudentList");
      if (!mentorMobile) {
        list.innerHTML = `<p class="text-xs text-slate-400">Select a mentor first.</p>`;
        return;
      }
      list.innerHTML = allocationClassStudents.map(s => {
        const checked = s.Mentor_Mobile_No === mentorMobile;
        return `
          <label class="flex items-center gap-2 p-1.5 hover:bg-white rounded cursor-pointer text-xs font-semibold">
            <input type="checkbox" name="allocStudentCheckbox" value="${s.Reg_No}" ${checked ? 'checked' : ''} class="w-4 h-4 text-blue-600 rounded">
            <span>${s.Name} (${s.Reg_No})</span>
          </label>
        `;
      }).join("");
    }

    function submitMentorAllocation() {
      const mentor = document.getElementById("allocationMentorSelect").value;
      const checkboxes = document.getElementsByName("allocStudentCheckbox");
      const selected = [];
      for (let cb of checkboxes) {
        if (cb.checked) selected.push(cb.value);
      }
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.status === "SUCCESS") {
            alert(response.message);
            closeMentorAllocationModal();
            fetchPrincipalData();
          } else {
            alert("Error: " + response.message);
          }
        })
        .assignMentorToStudents(currentAllocationClassId, mentor, selected);
    }

      // Stub matching GAS schema
    }

      sessionStorage.clear();
      navigateToPage("Login");
    }
